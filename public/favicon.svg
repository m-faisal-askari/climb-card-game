<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0f3d2e" />
      <stop offset="65%" stop-color="#071b14" />
      <stop offset="100%" stop-color="#020906" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Felt Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGlow)" stroke="#fbbf24" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Ascending Card 1 (Back Left - Lower Step) -->
  <g transform="translate(10, 22) rotate(-14)" filter="url(#shadow)">
    <rect width="18" height="26" rx="2.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Heart Symbol -->
    <path d="M9 13.5 C9 13.5 6 10.5 6 8.5 C6 6.8 7.3 5.5 9 7 C10.7 5.5 12 6.8 12 8.5 C12 10.5 9 13.5 9 13.5 Z" fill="#ef4444" transform="translate(0, 3)" />
  </g>

  <!-- Ascending Card 2 (Back Right - Mid Step) -->
  <g transform="translate(36, 17) rotate(13)" filter="url(#shadow)">
    <rect width="18" height="26" rx="2.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Diamond Symbol -->
    <polygon points="9,8 13.5,13.5 9,19 4.5,13.5" fill="#ef4444" transform="scale(0.8) translate(2.2, 2)" />
  </g>

  <!-- Foreground Main Card (Center - High Step / Climb Peak) -->
  <g transform="translate(22, 11)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="20" height="30" rx="3" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />

    <!-- Corner 3 indicator (Homage to 3 of Spades, Climb's opening card) -->
    <text x="3.2" y="6.8" font-family="system-ui, -apple-system, sans-serif" font-size="4.8" font-weight="900" fill="#0f172a">3</text>
    <text x="3.2" y="10.8" font-family="system-ui, -apple-system, sans-serif" font-size="3.6" font-weight="900" fill="#0f172a">♠</text>

    <!-- Center Bold Spade -->
    <g transform="translate(10, 16.5) scale(0.65)">
      <!-- Spade Body -->
      <path d="M0 -9 C-1.5 -6.5 -7.5 0 -7.5 4.5 C-7.5 8.2 -4.2 10.5 -0.5 8.5 C0 8.2 0 8.2 0.5 8.5 C4.2 10.5 7.5 8.2 7.5 4.5 C7.5 0 1.5 -6.5 0 -9 Z" fill="#0f172a" />
      <!-- Spade Base Stem -->
      <path d="M-1.5 7.5 L-3.5 12.5 L3.5 12.5 L1.5 7.5 Z" fill="#0f172a" />
    </g>

    <!-- Golden Crown Peak on top of card -->
    <path d="M6.5 4.5 L8.2 6.5 L10 3.5 L11.8 6.5 L13.5 4.5 L13.5 7.5 L6.5 7.5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Dynamic Climbing Chevron / Arrow at Bottom -->
  <g filter="url(#shadow)">
    <path d="M16 52 L32 44 L48 52 L32 47.5 Z" fill="url(#goldGrad)" />
  </g>
</svg>
